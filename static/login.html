<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="De Bouwkringloop">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-cirqo-192.png">
  <title>Inloggen — De Bouwkringloop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/base.css?v=3">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 32px) 16px
               calc(env(safe-area-inset-bottom) + 32px);
    }
    .wrap { width: 100%; max-width: 400px; margin: 0 auto; }
    .brand { margin-bottom: 32px; }
    .brand-sub {
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--orange); margin-top: 4px;
    }
    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
    }
    .panel h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem; font-weight: 900;
      margin-bottom: 20px;
    }
  </style>
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/static/ux.css">
</head>
<body>
  <div class="wrap">
    <div class="brand" style="text-align:center;margin-bottom:28px;">
      <img src="/static/bouwkringloop-logo.jpg" alt="De Bouwkringloop" style="height:56px;margin:0 auto 10px;display:block;">
      <div class="brand-sub" style="text-align:center;">Circulaire bouwmaterialen</div>
    </div>
    <div class="panel">
      <h1>Inloggen</h1>
      <form id="form">
        <div class="field">
          <label>E-mail of gebruikersnaam</label>
          <input type="text" id="login-input" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Wachtwoord</label>
          <input type="password" id="login-pass" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn" class="btn btn-primary">Inloggen</button>
        <div class="error-bar" id="err"></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    if (localStorage.getItem('token')) {
      const role = localStorage.getItem('role');
      location.href = new URLSearchParams(location.search).get('redirect') || (role === 'bedrijf' ? '/bedrijf' : '/');
    }

    firebase.initializeApp({
      apiKey: "AIzaSyDZOfYXQHCu3Bs7xjuukneAShqCEwvICTY",
      authDomain: "database-e5575.firebaseapp.com",
      projectId: "database-e5575",
      storageBucket: "database-e5575.firebasestorage.app",
      messagingSenderId: "317817675164",
      appId: "1:317817675164:web:d3aaf57a2bd1e3c6537c59",
    });
    const fbAuth = firebase.auth();

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const input = document.getElementById('login-input').value.trim();
      const pass  = document.getElementById('login-pass').value;
      btn.disabled = true; btn.textContent = 'Bezig…'; err.style.display = 'none';

      // Stap 1: probeer lokale login
      try {
        const fd = new FormData();
        fd.append('username', input);
        fd.append('password', pass);
        const res = await fetch('/api/auth/login', { method: 'POST', body: fd });
        const data = await res.json();
        if (res.ok) { _saveSession(data); _redirectNaLogin(data); return; }
        // Lokaal mislukt — als het een e-mail is, probeer Firebase
        if (!input.includes('@')) throw new Error(data.detail || 'Onjuiste gebruikersnaam of wachtwoord');
      } catch (ex) {
        if (!input.includes('@')) {
          err.textContent = ex.message; err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Inloggen'; return;
        }
      }

      // Stap 2: Firebase login (alleen voor e-mailadressen)
      try {
        const cred = await fbAuth.signInWithEmailAndPassword(input, pass);
        const idToken = await cred.user.getIdToken();
        const res = await fetch('/api/auth/firebase-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: idToken }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Fout');
        _saveSession(data); _redirectNaLogin(data);
      } catch (ex) {
        let msg = ex.message || 'Fout';
        if (msg.includes('wrong-password') || msg.includes('user-not-found') || msg.includes('invalid-credential')) msg = 'E-mail of wachtwoord onjuist';
        if (msg.includes('invalid-email')) msg = 'Ongeldig e-mailadres';
        err.textContent = msg; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Inloggen';
      }
    });

    function _redirectNaLogin(data) {
      location.href = new URLSearchParams(location.search).get('redirect') || (data.role === 'bedrijf' ? '/bedrijf' : '/');
    }

    function _saveSession(data) {
      localStorage.setItem('token',       data.token);
      localStorage.setItem('user_id',     data.user_id || '');
      localStorage.setItem('username',    data.username);
      localStorage.setItem('role',        data.role);
      localStorage.setItem('gemeente',    data.gemeente || '');
      localStorage.setItem('organisatie', data.organisatie || '');
      if (data.bedrijf_id) localStorage.setItem('bedrijf_id', data.bedrijf_id);
      if (data.role === 'bedrijf') {
        localStorage.setItem('bedrijf_token', data.token);
        localStorage.setItem('bedrijf_naam', data.organisatie || data.username);
      }
    }
  </script>

  <!-- PWA Install Prompt (zelfde als index.html) -->
  <style>
    #pwa-backdrop {
      position: fixed; inset: 0; z-index: 900;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(3px);
      opacity: 0; pointer-events: none;
      transition: opacity .3s ease;
    }
    #pwa-backdrop.pwa-show { opacity: 1; pointer-events: all; }
    #pwa-sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 901;
      background: #fff;
      border-radius: 20px 20px 0 0;
      padding: 0 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
      box-shadow: 0 -8px 40px rgba(0,0,0,.18);
      max-width: 520px; margin: 0 auto;
      transform: translateY(110%);
      transition: transform .42s cubic-bezier(.22,.8,.36,1);
    }
    #pwa-sheet.pwa-show { transform: translateY(0); }
    .pwa-handle { width: 40px; height: 4px; border-radius: 2px; background: #E8E8E8; margin: 12px auto 20px; }
    .pwa-close-btn { position: absolute; top: 14px; right: 16px; background: none; border: none; cursor: pointer; font-size: 1.3rem; color: #9A9690; line-height: 1; padding: 4px 8px; }
    .pwa-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .pwa-icon-wrap { width: 44px; height: 44px; border-radius: 12px; background: rgba(230,112,38,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .pwa-title { font-family: 'Outfit', sans-serif; font-size: 1.3rem; font-weight: 900; color: #1A1914; }
    .pwa-subtitle { font-size: 0.75rem; color: #9A9690; margin-top: 2px; }
    .pwa-steps { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .pwa-step { display: flex; align-items: flex-start; gap: 12px; opacity: 0; transform: translateX(-10px); animation: pwaStepIn .35s ease forwards; animation-delay: calc(var(--i) * .18s + .35s); }
    @keyframes pwaStepIn { to { opacity: 1; transform: translateX(0); } }
    .pwa-step-num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: rgba(230,112,38,0.08); color: #c45c1a; font-size: .75rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
    .pwa-step-text { font-size: .88rem; color: #444; line-height: 1.4; }
    .pwa-step-text strong { color: #1A1914; }
    .pwa-arrow-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 16px; opacity: 0; animation: pwaFadeIn .4s ease 1.1s forwards; }
    @keyframes pwaFadeIn { to { opacity: 1; } }
    .pwa-arrow-label { font-size: .7rem; color: #9A9690; }
    .pwa-arrow { font-size: 1.4rem; color: #e67026; animation: pwaBounce 1.3s ease-in-out infinite; }
    @keyframes pwaBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
    .pwa-android-btn { width: 100%; padding: 14px; background: #e67026; color: #fff; border: none; border-radius: 12px; font-family: 'Inter', system-ui, sans-serif; font-size: .95rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
    .pwa-not-now { display: block; width: 100%; background: none; border: none; cursor: pointer; font-family: 'Inter', system-ui, sans-serif; font-size: .8rem; color: #9A9690; padding: 8px; text-align: center; }
  </style>

  <div id="pwa-backdrop"></div>
  <div id="pwa-sheet">
    <div class="pwa-handle"></div>
    <button class="pwa-close-btn" id="pwa-close">&times;</button>
    <div class="pwa-head">
      <div class="pwa-icon-wrap">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e67026" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      </div>
      <div>
        <div class="pwa-title">Installeer de app</div>
        <div class="pwa-subtitle">Snelle toegang &amp; pushmeldingen</div>
      </div>
    </div>
    <div id="pwa-ios" class="pwa-steps">
      <div class="pwa-step" style="--i:0"><span class="pwa-step-num">1</span><span class="pwa-step-text">Tik op het <strong>deel-icoon ⬆</strong> onderin de browserbalk</span></div>
      <div class="pwa-step" style="--i:1"><span class="pwa-step-num">2</span><span class="pwa-step-text">Scroll omlaag en kies <strong>Zet op beginscherm</strong></span></div>
      <div class="pwa-step" style="--i:2"><span class="pwa-step-num">3</span><span class="pwa-step-text">Tik op <strong>Voeg toe</strong> om te bevestigen</span></div>
    </div>
    <div id="pwa-arrow-wrap" class="pwa-arrow-wrap">
      <span class="pwa-arrow-label">Deel-icoon staat hier</span>
      <span class="pwa-arrow">↓</span>
    </div>
    <div id="pwa-android" style="display:none;margin-bottom:8px;">
      <button class="pwa-android-btn" id="pwa-android-btn">Installeer app</button>
    </div>
    <button class="pwa-not-now" id="pwa-dismiss">Niet nu</button>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'pwa_prompt_ts';
      const COOLDOWN_MS = 7 * 24 * 60 * 60 * 1000;

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (!isMobile) return;

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      if (isStandalone) return;

      const last = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10);
      if (Date.now() - last < COOLDOWN_MS) return;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      let deferredPrompt = null;

      function showSheet() {
        document.getElementById('pwa-backdrop').classList.add('pwa-show');
        document.getElementById('pwa-sheet').classList.add('pwa-show');
      }
      function hideSheet() {
        document.getElementById('pwa-backdrop').classList.remove('pwa-show');
        document.getElementById('pwa-sheet').classList.remove('pwa-show');
        localStorage.setItem(STORAGE_KEY, String(Date.now()));
      }

      document.getElementById('pwa-close').addEventListener('click', hideSheet);
      document.getElementById('pwa-dismiss').addEventListener('click', hideSheet);
      document.getElementById('pwa-backdrop').addEventListener('click', hideSheet);

      if (!isIOS) {
        document.getElementById('pwa-ios').style.display = 'none';
        document.getElementById('pwa-arrow-wrap').style.display = 'none';
      }

      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwa-android').style.display = 'block';
        document.getElementById('pwa-android-btn').addEventListener('click', async function () {
          await deferredPrompt.prompt();
          hideSheet();
        });
      });

      setTimeout(showSheet, 1400);
    })();
  </script>
  <script src="/static/ux.js"></script>
</body>
</html>
