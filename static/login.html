<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Inloggen — CIRQO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/base.css?v=3">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 32px) 16px
               calc(env(safe-area-inset-bottom) + 32px);
    }
    .wrap { width: 100%; max-width: 400px; margin: 0 auto; }
    .brand { margin-bottom: 32px; }
    .brand-sub {
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--orange); margin-top: 4px;
    }
    .panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px;
    }
    .panel h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.6rem; font-weight: 900;
      margin-bottom: 20px;
    }
  </style>
  <link rel="stylesheet" href="/brand.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <img src="/static/bar-logo.jpg" alt="CIRQO" style="height:48px;margin-bottom:8px;display:block;">
      <div class="brand-sub">Registratiesysteem</div>
    </div>
    <div class="panel">
      <h1>Inloggen</h1>
      <form id="form">
        <div class="field">
          <label>E-mail of gebruikersnaam</label>
          <input type="text" id="login-input" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Wachtwoord</label>
          <input type="password" id="login-pass" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn" class="btn btn-primary">Inloggen</button>
        <div class="error-bar" id="err"></div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    if (localStorage.getItem('token')) {
      const role = localStorage.getItem('role');
      location.href = new URLSearchParams(location.search).get('redirect') || (role === 'bedrijf' ? '/bedrijf' : '/');
    }

    firebase.initializeApp({
      apiKey: "AIzaSyDZOfYXQHCu3Bs7xjuukneAShqCEwvICTY",
      authDomain: "database-e5575.firebaseapp.com",
      projectId: "database-e5575",
      storageBucket: "database-e5575.firebasestorage.app",
      messagingSenderId: "317817675164",
      appId: "1:317817675164:web:d3aaf57a2bd1e3c6537c59",
    });
    const fbAuth = firebase.auth();

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      const input = document.getElementById('login-input').value.trim();
      const pass  = document.getElementById('login-pass').value;
      btn.disabled = true; btn.textContent = 'Bezig…'; err.style.display = 'none';

      // Stap 1: probeer lokale login
      try {
        const fd = new FormData();
        fd.append('username', input);
        fd.append('password', pass);
        const res = await fetch('/api/auth/login', { method: 'POST', body: fd });
        const data = await res.json();
        if (res.ok) { _saveSession(data); _redirectNaLogin(data); return; }
        // Lokaal mislukt — als het een e-mail is, probeer Firebase
        if (!input.includes('@')) throw new Error(data.detail || 'Onjuiste gebruikersnaam of wachtwoord');
      } catch (ex) {
        if (!input.includes('@')) {
          err.textContent = ex.message; err.style.display = 'block';
          btn.disabled = false; btn.textContent = 'Inloggen'; return;
        }
      }

      // Stap 2: Firebase login (alleen voor e-mailadressen)
      try {
        const cred = await fbAuth.signInWithEmailAndPassword(input, pass);
        const idToken = await cred.user.getIdToken();
        const res = await fetch('/api/auth/firebase-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id_token: idToken }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Fout');
        _saveSession(data); _redirectNaLogin(data);
      } catch (ex) {
        let msg = ex.message || 'Fout';
        if (msg.includes('wrong-password') || msg.includes('user-not-found') || msg.includes('invalid-credential')) msg = 'E-mail of wachtwoord onjuist';
        if (msg.includes('invalid-email')) msg = 'Ongeldig e-mailadres';
        err.textContent = msg; err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Inloggen';
      }
    });

    function _redirectNaLogin(data) {
      location.href = new URLSearchParams(location.search).get('redirect') || (data.role === 'bedrijf' ? '/bedrijf' : '/');
    }

    function _saveSession(data) {
      localStorage.setItem('token',       data.token);
      localStorage.setItem('user_id',     data.user_id || '');
      localStorage.setItem('username',    data.username);
      localStorage.setItem('role',        data.role);
      localStorage.setItem('gemeente',    data.gemeente || '');
      localStorage.setItem('organisatie', data.organisatie || '');
      if (data.bedrijf_id) localStorage.setItem('bedrijf_id', data.bedrijf_id);
      if (data.role === 'bedrijf') {
        localStorage.setItem('bedrijf_token', data.token);
        localStorage.setItem('bedrijf_naam', data.organisatie || data.username);
      }
    }
  </script>
</body>
</html>
